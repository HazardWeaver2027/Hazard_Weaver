[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hazardweaver"
version = "1.0.0"
description = "HazardWeaver — route selection for multi-hazard analysis agents (HWB benchmark release)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anonymous Authors" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
inference = ["langgraph>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
