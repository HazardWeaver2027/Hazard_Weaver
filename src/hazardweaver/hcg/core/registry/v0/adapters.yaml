adapters:
- adapter_id: wf_pack_atomic_to_incident_8d_v0
  description: Pack atomic incident fields → 8d bundle (partial elevation demo; remaining
    dims filled by dataset defaults)
  consumes:
  - wf_lat
  - wf_lon
  - wf_discovery_doy
  produces:
  - wf_incident_features_8d
  adapter_type: feature_derivation
  bridges:
  - schema_id
  source_ref: null
  namespaces:
  - wildfire
  implementation_ref: hcg.runtime.ops:wf_pack_atomic_to_incident_8d
- adapter_id: wf_firms_daily_to_weekly_v0
  description: Aggregate FIRMS daily hotspots → weekly county tensor (executable)
  consumes:
  - wf_firms_hotspots
  produces:
  - wf_weekly_county_tensor
  adapter_type: temporal_aggregation
  bridges:
  - temporal_frequency
  - history
  - schema_id
  source_ref: null
  namespaces:
  - wildfire
  implementation_ref: hcg.runtime.ops:wf_firms_daily_to_weekly
- adapter_id: wf_mask_to_burn_fraction_v0
  description: Spatial aggregate burned mask → basin burn fraction
  consumes:
  - wf_burned_mask
  produces:
  - wf_basin_burn_fraction
  adapter_type: spatial_aggregation
  bridges:
  - spatial_support
  - schema_id
  source_ref: null
  namespaces:
  - wildfire
  implementation_ref: hcg.runtime.ops:wf_mask_to_burn_fraction
- adapter_id: wf_landfire_to_spread_frame_v0
  description: Resample LANDFIRE fuel to spread model raster frame (explicit adapter; not inside capability)
  consumes:
  - wf_landfire_fuel
  produces:
  - wf_fuel_spread_frame_v1
  adapter_type: spatial_aggregation
  bridges:
  - spatial_support
  - schema_id
  lossy: true
  information_change_kinds: [resample]
  source_ref: null
  namespaces:
  - wildfire
  implementation_ref: hcg.runtime.ops:wf_fuel_to_spread_frame_v1
- adapter_id: fl_depth_to_peak_v0
  description: Reduce inundation depth raster → peak depth scalar
  consumes:
  - fl_inundation_depth
  produces:
  - fl_peak_depth
  adapter_type: spatial_aggregation
  bridges:
  - schema_id
  - spatial_support
  source_ref: null
  namespaces:
  - flood
  implementation_ref: hcg.runtime.ops:fl_depth_to_peak
