- family_id: eq_classical_v1
  task_id: E1-E3
  distinctness_axis: classical
  canonical_output: eq_catalog_source_groundmotion_bundle_v1
  description: Classical STA/LTA picker with template association catalog builder
  assumptions:
  - sta_lta_picking
  - template_association
  - magnitude_distance_relation
  applicability:
    waveform: required
    station_count: '>=1'
  slots:
  - slot_id: ingest_waveform
    role: observation_source
    produces:
    - eq_waveform_3c
    requires:
      modality: waveform
      semantic_role: observation
  - slot_id: picker
    role: classical_picker
    consumes:
    - eq_waveform_3c
    produces:
    - eq_ps_pick_indices
    requires:
      modality: tabular
      semantic_role: latent
  - slot_id: catalog_builder
    role: catalog_solver
    consumes:
    - eq_ps_pick_indices
    produces:
    - eq_catalog_source_groundmotion_bundle_v1
    requires:
      modality: record
      semantic_role: prediction
  resources:
    min_gpu_s: 0
    typical_cpu_s: 60
    ram_mb: 256
  admission: replayed
  version: v1
  provenance: iclr_headline_v1
