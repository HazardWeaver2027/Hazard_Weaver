# PL 2.6-compatible trainer for WF-3 scientific replay (no WandbLogger YAML).
# Vendor cfgs/trainer_single_gpu.yaml WandbLogger class_path fails under jsonargparse>=4.27.
# max_epochs=500 matches vendor; EarlyStopping stops when val_loss plateaus (same monitor as checkpoint).
accelerator: gpu
strategy: auto
devices: 1
num_nodes: 1
precision: 32-true
logger: false
callbacks:
  - class_path: pytorch_lightning.callbacks.model_checkpoint.ModelCheckpoint
    init_args:
      monitor: val_loss
      mode: min
      save_last: true
  - class_path: pytorch_lightning.callbacks.early_stopping.EarlyStopping
    init_args:
      monitor: val_loss
      mode: min
      patience: 15
      min_delta: 0.0
      check_on_train_epoch_end: false
fast_dev_run: false
max_epochs: 500
min_epochs: -1
max_steps: -1
min_steps: -1
max_time: null
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null
limit_predict_batches: null
overfit_batches: 0.0
val_check_interval: null
check_val_every_n_epoch: 1
num_sanity_val_steps: null
log_every_n_steps: null
enable_checkpointing: null
enable_progress_bar: false
enable_model_summary: null
accumulate_grad_batches: 1
gradient_clip_val: null
gradient_clip_algorithm: null
deterministic: warn
benchmark: false
inference_mode: true
use_distributed_sampler: true
profiler: null
detect_anomaly: false
barebones: false
plugins: null
sync_batchnorm: false
reload_dataloaders_every_n_epochs: 0
default_root_dir: ./lightning_logs
