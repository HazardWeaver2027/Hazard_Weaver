    dims filled by dataset defaults)
  consumes:
  - wf_lat
  - wf_lon
  - wf_discovery_doy
  produces:
  - wf_incident_features_8d
  adapter_type: feature_derivation
  bridges:
  - schema_id
  source_ref: null
  namespaces:
  - wildfire
  implementation_ref: null
- adapter_id: wf_firms_daily_to_weekly_v0
  description: Aggregate FIRMS daily hotspots → weekly county tensor (placeholder
    executable TBD)
  consumes:
  - wf_firms_hotspots
  produces:
  - wf_weekly_county_tensor
  adapter_type: temporal_aggregation
